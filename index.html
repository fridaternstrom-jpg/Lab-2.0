<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://kit.fontawesome.com/526849ee76.js" crossorigin="anonymous" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
        rel="stylesheet">
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
        <link rel="icon" type="image/x-icon" href="/favicon.ico">
        <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>Labororation 2.0</title>
</head>

<body>
    <header>
        <a href="index.html" class="logoarea"><img id="logonav" src="images/logo.svg" alt="Till startsidan"></a>
        <nav>
            <ul>
                    <li class="linkarea"><a href="index.html"><i class="fa-solid fa-house"></i>Hem</a></li>
                
                    <li class="linkarea"><a href="images.html"><i class="fa-solid fa-images"></i>Bilder</a></li>
                
                    <li class="linkarea"><a href="about.html"><i class="fa-solid fa-user"></i>Info</a></li>

            </ul>
        </nav>
    </header>
    <main>
        <div class="topbar">
            <a href="index.html" id="logotop"><img id="logoimg" src="images/logo.svg" alt="Till startsidan"></a>
            <p>Laboration 2.0</p>
        </div>
        <picture>
            <source srcset="images/header-1200.avif" 
            type="image/avif"
            sizes="100vw"
            media="(min-width: 800px)">

            <source srcset="images/header-1200.png" 
            media="(min-width: 800px)"
            sizes="100vw">

            <source srcset="
            images/header-small-600.avif 600w,
            images/header-small-800.avif 800w" 
            type="image/avif"
            sizes="100vw">

            <img id="heroimg" 
            src="images/header-small-600.png"
            srcset="images/header-small-600.png 600w,
            images/header-small-800.png 800w"
            sizes="100vw"
            width="600"
            height="557"
            alt="utsikt över skånska vidder i dimma" 
            fetchpriority="high">
        </picture>
        <section id="info">
            <h1>Laboration 2.0</h1>
            <p>I den här laborationen har jag fått i uppdrag att optimera och redigera
                ett antal bilder, som jag kommer att redovisa på den här sidan. <br><br>
                Bilderna har redigerats i Photopea</p>
            <a href="images.html" class="imgbutton">Se resultat</a>
        </section>
        <section id="preshow">
            <h2>Dessa bilder har jag redigerat:</h2>

            <picture>
                <source srcset="images/bildserie006.webp" 
                type="image/webp"
                media="(min-width: 800px)">
                
                <source srcset="images/bildeserie006.jpg"
                media="(min-width: 800px)">

                <source srcset="images/bildserie006small.webp"
                type="image/webp">

                <img class="preshowimg" src="images/bildserie006small.jpg" 
                alt="grön fluga sitter mitt i en blomma" 
                loading="lazy">
            </picture>

            <picture>
                <source srcset="images/bildserie017.webp" 
                type="image/webp"
                media="(min-width: 800px)">

                <source srcset="images/bildserie017.jpg"
                media="(min-width: 800px)">

                <source srcset="images/bildserie017small.webp"
                type="image/webp"
                media="(min-width: 800px)">

            <img class="preshowimg" 
            src="images/bildserie017small.jpg" 
            alt="vy över flod och berg i djungel" 
            loading="lazy">
            </picture>

            <picture>
                <source srcset="images/bildserie001.webp" 
                type="image/webp" 
                media="(min-width: 800px)">

                <source srcset="images/bildserie001.jpg" 
                media="(min-width: 800px)">

                <source srcset="images/bildserie001small.webp" 
                type="image/webp">

            <img class="preshowimg" 
            src="images/bildserie001small.jpg" 
            alt="två rosa blommor med en berg i bakgrunden" 
            loading="lazy">
            </picture>

            <picture>
                <source srcset="images/bildserie004.webp" 
                type="image/webp"
                media="(min-width: 800px)">

                <source srcset="images/bildserie004.jpg"
                media="(min-width: 800px)">

                <source srcset="images/bildserie004small.webp"
                type="image/webp">

                <img class="preshowimg" 
                src="images/bildserie004small.jpg" 
                alt="kargt landskap där vatten rinner genom kullar" 
                loading="lazy">
            </picture>
            <a href="about.html" class="aboutbutton">Om mig</a>
        </section>
    </main>
</body>

</html>
